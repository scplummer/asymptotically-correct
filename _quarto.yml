project:
  type: website
  output-dir: _site

website:
  title: "Asymptotically Correct"
  description: "Research notes on singular learning theory, variational inference, fairness, and more."
  site-url: "https://scplummer.github.io/asymptotically-correct"
  navbar:
    background: primary
    left:
      - text: "SLT"
        href: posts/slt/index.qmd
    right:
      - href: projects.qmd
        text: "Projects"
      - href: about.qmd
        text: "About"
  page-footer:
    left: "© `r format(Sys.Date(), '%Y')` Sean Plummer"
    right: "Built with Quarto · Asymptotically Correct"

format:
  html:
    theme:
      light: flatly
      dark: darkly
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    smooth-scroll: true
    anchor-sections: true
    number-sections: false

metadata-files: []
